
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do You Like Me? 💗</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="hearts-container" id="heartsContainer"></div>

    <main class="card">
        <div class="top-badge">💌 A LITTLE QUESTION</div>

        <div class="emoji" id="mainEmoji">🥹💗</div>

        <h1 id="mainTitle">Do you like me?</h1>

        <p class="subtitle" id="mainMessage">
            I've been wanting to ask you something...
        </p>

        <div class="divider"><span>♥</span></div>

        <p class="question">
            Will you give me a chance<br>
            to make you smile every day?
        </p>

        <div class="buttons-area" id="buttonsArea">
            <button id="yesBtn" class="yes-btn">Yes! 💖</button>
            <button id="noBtn" class="no-btn">No 😢</button>
        </div>

        <p class="hint" id="hint">Choose wisely hehe 🙈</p>

        <div class="footer">Made with love 💕</div>
    </main>

    <div class="success-screen" id="successScreen">
        <div class="success-card">
            <div class="success-emoji">🥰💐</div>
            <h1>YAAAY! 💗</h1>
            <p id="successMessage">You just made my day!</p>
            <p class="love-note">
                I hope this is the beginning of
                something beautiful. 💖
            </p>
            <button id="backBtn" class="yes-btn">
                Back to my question 💌
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
